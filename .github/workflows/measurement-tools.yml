name: Measurement tools
on:
  push:
    paths: ['tools/**', '.github/workflows/measurement-tools.yml']
  pull_request:
    paths: ['tools/**', '.github/workflows/measurement-tools.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install -r tools/requirements-analysis.txt
      - name: Test intake, stimulus integrity and synthetic alignment
        run: python -m unittest discover -s tools/tests -v
